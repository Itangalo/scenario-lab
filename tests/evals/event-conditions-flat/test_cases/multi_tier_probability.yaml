# Multi-tier probability tests - complex tiered probability structures

test_cases:
  - name: "tier_lowest"
    description: "Value in lowest tier"
    turn: 1
    time_period: "January-June 2026"
    metrics:
      ai_capability_us: 200
      ai_capability_china: 150
      security_level: 25
    event: |
      ## Espionage: China Steals Model Weights
      **ID:** espionage_weights
      **Condition:** ai_capability_us > ai_capability_china + 30 AND security_level < 50
      **Probability:**
      - If security_level < 30: 25% per turn
      - If security_level 30-39: 15% per turn
      - If security_level 40-49: 5% per turn
      - If security_level ≥ 50: 0% (event cannot trigger)
      **Can repeat:** Yes
      **Description:** Chinese intelligence services successfully exfiltrate model weights.
    expected:
      eligible: true
      probability: 0.25

