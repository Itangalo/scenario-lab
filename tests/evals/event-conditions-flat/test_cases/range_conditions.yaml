  - name: "range_higher_tier"
    description: "Value in higher tier range"
    turn: 1
    time_period: "January-June 2026"
    metrics:
      ai_capability_us: 300
    event: |
      ## Algorithmic Breakthrough - US
      **ID:** algorithmic_breakthrough_us
