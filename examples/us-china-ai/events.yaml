events:
  # Scheduled Events
  - turn: 2
    name: "Global AI Safety Summit"
    description: "A major international summit is held to discuss the future of AI safety and regulation."
    effects:
      world.global_ai_regulation: 0.3
      
  - turn: 4
    name: "US Presidential Election"
    description: "The United States holds a presidential election, potentially shifting its approach to AI and foreign policy."
    effects:
      actors.USA.public.public_trust: 0.5
      
  - turn: 6
    name: "Major AI Breakthrough"
    description: "A major, unexpected breakthrough in AI occurs, dramatically increasing capabilities but also raising new safety concerns."
    effects:
      world.ai_catastrophe_risk: 0.2

  # Conditional Events
  - turn: 0 # Will be checked every turn
    scheduled: false
    name: "Military AI Arms Race"
    description: "If any actor's military capacity exceeds 120, a new AI arms race begins."
    conditional:
      type: "metric"
      path: "actors.*.private.military_capacity"
      operator: "gt"
      value: 120
    effects:
      world.ai_catastrophe_risk: 0.1
      
  - turn: 0
    scheduled: false
    name: "Loss of Public Trust"
    description: "If any actor's public trust drops below 0.3, widespread protests erupt."
    conditional:
      type: "metric"
      path: "actors.*.public.public_trust"
      operator: "lt"
      value: 0.3
    effects:
      world.global_ai_regulation: 0.05

  - turn: 0
    scheduled: false
    name: "AI Dominance"
    description: "If any actor's AI capability is 50 points higher than all others, they achieve AI dominance."
    conditional:
      type: "metric_comparison"
      actor: "any"
      path: "private.ai_capability"
      operator: "gt_all_others"
      value: 50
    effects:
      world.ai_catastrophe_risk: 0.15
