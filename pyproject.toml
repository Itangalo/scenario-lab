[project]
name = "scenario-lab"
version = "4.0.0"
description = "LLM-driven scenario simulation framework"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
scenario-lab = "scenario_lab.cli:main"
