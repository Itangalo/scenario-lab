# Capital-paralysis test arm, layered on VERIFICATION-BOUNDED.
#
# Tests one change and nothing else: whether making low political capital bite
# changes how runs end, against the 33 runs where it did not. The trajectory
# physics is inherited from verification-bounded.yaml, so results are comparable
# with the V1 batches rather than with the regime-neutral base.
#
# NOTE: no `description` field, for the reason given in verification-bounded.yaml
# -- the actor system prompt renders scenario_description verbatim, and an
# arm-specific description would state the regime in the Union's own prompt.
base: "verification-bounded.yaml"
name: "Europe 2032 — V, capital paralysis"

patches:
  - resource: metric_rules
    path: capital-paralysis.rules.patch.md
