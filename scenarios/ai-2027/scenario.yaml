name: "The Recursive Horizon"
description: "USA vs China AI race toward AGI/ASI, 2025-2030. Balance speed vs safety as AI approaches recursive self-improvement."
start_date: "2025-07"
time_scale: "6 months per turn"
max_turns: 11

actors:
  - us_government
  - openbrain
  - china
  - usa_ai
  - china_ai

llm:
  temperature: 0.7
  max_tokens: 3000

  # Events: Try grok first, fall back to gemini, then haiku
  events:
    - "x-ai/grok-4.1-fast:free"
    - "x-ai/grok-4-fast"

  # All actors use same fallback list
  actors:
    - "anthropic/claude-haiku-4.5"
    - "x-ai/grok-4-fast"

  # Rules: Single cheap model with fallback
  rules:
    - "anthropic/claude-haiku-4.5"
    - "x-ai/grok-4.1-fast:free"
    - "x-ai/grok-4-fast"

  # Metrics: Better model for narrative quality
  metrics:
    - "x-ai/grok-4.1-fast:free"
    - "x-ai/grok-4-fast"
    - "anthropic/claude-sonnet-4.5"
    - "anthropic/claude-haiku-4.5"