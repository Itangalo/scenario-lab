name: "AI 2027: The Recursive Horizon"
description: "A simulation of the race toward AGI and ASI between USA and China, focusing on the balance between speed and safety."
start_date: "2025-07"
time_scale: "6 months per turn"
max_turns: 11
output_language: "English"

actors:
  - usa_government
  - openbrain
  - china
  - ai_usa
  - ai_china

llm:
  temperature: 0.7
  max_tokens: 2000

  # Events: Try grok first, fall back to gemini, then haiku
  events:
    - "x-ai/grok-4.1-fast:free"
    - "x-ai/grok-4-fast"

  # All actors use same fallback list
  actors:
    - "anthropic/claude-haiku-4.5"
    - "x-ai/grok-4-fast"

  # Rules: Single cheap model with fallback
  rules:
    - "anthropic/claude-haiku-4.5"
    - "x-ai/grok-4.1-fast:free"
    - "x-ai/grok-4-fast"

  # Metrics: Better model for narrative quality
  metrics:
    - "x-ai/grok-4.1-fast:free"
    - "x-ai/grok-4-fast"
    - "anthropic/claude-sonnet-4.5"
    - "anthropic/claude-haiku-4.5"