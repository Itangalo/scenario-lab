name: "The Recursive Horizon"
description: "USA vs China AI race toward AGI/ASI, 2025-2030. Balance speed vs safety as AI approaches recursive self-improvement."
start_date: "2025-07"
time_scale: "6 months per turn"
max_turns: 11

actors:
  - us_government
  - openbrain
  - china
  - usa_ai
  - china_ai

llm:
  temperature: 0.7
  max_tokens: 3000

  # Events: default cheap model, then richer fallback
  events:
    - "x-ai/grok-4.1-fast"
    - "google/gemini-3-flash-preview"

  # Most actors use same fallback list
  actors:
    default:
      - "x-ai/grok-4.1-fast"
      - "google/gemini-3-flash-preview"
    usa_ai:
      - "deepseek/deepseek-chat-v3-0324"
      - "x-ai/grok-4.1-fast"
    china_ai:
      - "deepseek/deepseek-chat-v3-0324"
      - "x-ai/grok-4.1-fast"

  # Rules: Single cheap model with fallback
  rules:
    - "x-ai/grok-4.1-fast"
    - "google/gemini-3-flash-preview"

  # Metrics: Better model for narrative quality
  metrics:
    - "google/gemini-3-flash-preview"
    - "x-ai/grok-4.1-fast"
