name: "Global AI Live"
description: "Live 90-minute workshop game for German politicians (non-experts): experience that advanced AI is real and what its larger consequences – risks and benefits – may be over 2026–2029"
start_date: "2026-07"
time_scale: "1 year per turn"
max_turns: 3

actors:
  - us-gov
  - us-labs
  - china
  - eu

research_questions:
  - id: rq_benefits_vs_disruption
    question: "Do rapid scientific breakthroughs arrive fast enough to be felt, or does labor disruption and information decay dominate the 2026–2029 window?"
    metrics: [scientific_progress, labor_displacement, information_integrity, public_trust]
    events: [science_windfall, jobs_shock, information_crisis, capability_leap]
  - id: rq_dependence_and_tension
    question: "Does Europe's dependence on US AI deepen, and does US-China tension tip toward hot conflict?"
    metrics: [eu_us_dependence, us_china_tension, governance_strength]
    events: [compute_bottleneck, strait_clash, bio_misuse_scare, control_scare]

llm:
  model: "opencode:opencode/muse-spark-1.3-contributor-free"
  # The referee (statement-relevance checks) stays on the cheap default
  # deliberately, mirroring europe-2032.
  referee: "openrouter:qwen/qwen3-235b-a22b-2507"
  temperature: 0.7
  max_tokens: 3000
  # muse-spark reasons mandatorily and bills it as completion tokens: at the
  # default effort a turn step can spend its whole budget thinking and return
  # nothing parseable. Minimal keeps the live steps fitting (same rationale
  # as europe-2032). Note: only honored on OpenRouter routes; the opencode
  # provider owns sampling settings server-side.
  reasoning_effort: minimal
  max_tokens_by_task:
    rules: 3500

rule_evolution:
  freeze_until_turn: 3
  max_changes_per_turn: 2

# Who generated language is for. Rendered into menu and narrative prompts
# so handout wording fits the room; free text, tuned per workshop.
workshop:
  audience: "German politicians without an AI background; assume no technical vocabulary, explain terms like frontier model, compute, open weights, and deepfake in plain words, use concrete everyday examples"
  tone: "plain, jargon-free, brisk, vivid but never sensationalist"
