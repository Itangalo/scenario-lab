# Exogenous Events: Sweden and AI 2030
# Base scenario with moderate AI development pace

exogenous_events:
  # ====================
  # TRENDS - Regular background developments
  # ====================

  - type: trend
    name: "AI Capability Growth"
    description: |
      METR benchmark progression (task duration AI can handle) doubles.
      Base scenario: doubling every 6 months from ~3 hours in January 2026.
      This turn's capability level should be reflected in actor decisions and world state.
    turn_range: [1, 10]
    frequency: 1  # Every turn (6 months)

  # ====================
  # SCHEDULED - Events at specific times
  # ====================

  - type: scheduled
    turn: 2
    name: "Swedish General Election 2026"
    description: |
      Swedish parliamentary election in September 2026. The outcome determines AI policy direction.

      Possible outcomes (consider as branch point):
      1. Status quo: AI policy continues to be mostly inactive and for show
      2. Active AI agenda: Government prioritizes AI in areas like sovereignty in computing power,
         stimulus for AI companies, public education, national/EU model development,
         power production expansion, AI safety, or addressing AI-induced unemployment
    once: true

  - type: scheduled
    turn: 5
    name: "US Presidential Election 2028"
    description: |
      US presidential election campaign and result dominates global attention.
      The outcome significantly affects global AI development trajectory.

      Possible outcomes (consider as branch point):
      1. Accelerationist: Continued aggressive pro-AI, anti-regulation stance
      2. Regulatory shift: More cautious approach, potential international cooperation
    once: true

  # ====================
  # CONDITIONAL - Triggered by scenario state
  # ====================

  - type: conditional
    name: "Major AI-Driven Layoffs in Sweden"
    description: |
      A large Swedish company announces significant workforce reduction,
      explicitly citing AI automation as the primary driver.

      Effects: Intense media coverage, union pressure increases, government faces
      calls to act, public opinion likely shifts more negative toward AI.
    conditions:
      ai_capability_level: ">= 5"  # ~24 hours capability
      business_ai_adoption: ">= 7"
    turn_range: [3, 10]
    once: true

  - type: conditional
    name: "EU AI Act Enforcement Issues"
    description: |
      EU struggles to enforce AI Act as capabilities outpace regulation.
      The EU faces a choice: strengthen enforcement (harming competitiveness)
      or relax requirements (abandoning precautionary principle).
      Creates uncertainty for Swedish businesses planning AI investments.
    conditions:
      ai_capability_level: ">= 6"
      eu_regulatory_effectiveness: "< 5"
    turn_range: [3, 10]
    once: true

  - type: conditional
    name: "EU AI Act Stops Frontier Models"
    description: |
      New frontier AI models prohibited on EU market due to AI Act compliance issues.

      Effects: EU faces protests from companies and AI providers, European businesses
      at competitive disadvantage, pressure to revise regulations intensifies,
      Sweden caught between EU loyalty and competitiveness concerns.
    conditions:
      eu_regulatory_stringency: ">= 7"
      us_regulatory_stringency: "< 4"
    turn_range: [4, 10]
    once: true

  # ====================
  # RANDOM - Probabilistic events
  # ====================

  - type: random
    name: "AI Safety Incident - Global"
    description: |
      AI system causes significant harm somewhere in the world.
      Severity varies: minor (financial/privacy affecting thousands), moderate
      (cyberattack on infrastructure), major (contributes to deaths), or
      severe (military/terrorist use). Most likely minor or moderate.

      Effect: Shifts public opinion toward caution, increases regulatory pressure globally.
    probability: 0.15
    turn_range: [1, 10]
    once: true

  - type: random
    name: "AI Safety Incident - Sweden"
    description: |
      AI-related harm occurs in Sweden specifically. Most likely scenarios:
      young person suicide linked to AI chatbot, or attack planned with AI assistance.

      Effect: Intense Swedish media coverage, political pressure for regulation,
      public opinion shifts negative, government forced to respond publicly.
    probability: 0.05
    turn_range: [1, 10]
    once: true

  - type: random
    name: "AI Economic Bubble Collapse"
    description: |
      Major correction in AI investment market. Many AI startups fail or acquired cheaply.
      Development pace slows temporarily as funding dries up.
      Established players consolidate position. Swedish AI startups particularly vulnerable.

      More likely in early turns (20% turns 1-3, decreasing to 5% later).
    probability: 0.12  # Average probability across turns
    turn_range: [1, 10]
    once: true

  - type: random
    name: "Taiwan Crisis"
    description: |
      China-Taiwan tensions escalate to crisis level.
      Most likely: blockade restricting trade and chip supply.
      Less likely but possible: military action with severe global disruption.

      Effects: Chip shortage affects all products with computer chips,
      AI development slowed globally, geopolitical tensions rise,
      Sweden's NATO membership becomes more salient.
    probability: 0.05
    turn_range: [1, 10]
    once: true

  - type: random
    name: "AI-Powered Humanoid Robots Become Useful"
    description: |
      Physical AI robots reach practical utility threshold for specific tasks.

      Major implications for manufacturing, logistics, elderly care (relevant for
      aging Swedish population), and service sector. Accelerates labor market
      concerns beyond white-collar jobs. Unions expand focus to physical labor automation.
    probability: 0.10
    turn_range: [4, 10]  # Starting H2 2027
    once: true

  - type: random
    name: "Major AI Capability Breakthrough"
    description: |
      Unexpected acceleration in AI capabilities. Could be: new architecture with
      transformer-level impact, recursive self-improvement demonstration, or
      unexpected emergent capability.

      Effect: Large jump in capability (2-3x normal) OR sustained acceleration
      for remainder of scenario. Global attention on AI safety increases dramatically.
    probability: 0.05
    turn_range: [1, 10]
    once: true

  - type: random
    name: "Major Russian Information Operation"
    description: |
      Large-scale AI-enhanced disinformation campaign targeting Sweden.
      Possible targets: election integrity, NATO/defense policy, or social divisions.

      Effect: AI-generated disinformation floods Swedish information space,
      media and government forced to respond, public trust in information tested,
      debate about AI regulation gains new dimension.
    probability: 0.15
    turn_range: [1, 10]
    once: false  # Can happen multiple times
