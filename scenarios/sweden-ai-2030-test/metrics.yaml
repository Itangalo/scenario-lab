# Metrics for Sweden AI 2030 scenario

metrics:
  # AI capability measured by METR benchmark (task duration AI can handle)
  - name: ai_capability_hours
    description: "AI capability measured in hours of human-equivalent task completion (METR benchmark)"
    type: continuous
    range: [1, 10000]
    unit: "hours"
    extraction:
      type: llm
      prompt: |
        Based on the world state, estimate the current AI capability level using the
        METR benchmark: how many hours of skilled human work can AI systems reliably
        complete in software development tasks?

        The baseline in January 2026 was approximately 3 hours, doubling every 6 months.

        Respond with ONLY a number (hours). Examples: 3, 6, 12, 24, 48, 96
    actor_specific: false

  # AI usage in Swedish workplaces
  - name: ai_workplace_adoption
    description: "Percentage of Swedish workers using AI tools at work"
    type: continuous
    range: [0, 100]
    unit: "percent"
    extraction:
      type: llm
      prompt: |
        Based on the world state, estimate the percentage of Swedish workers who
        regularly use AI tools in their work.

        The baseline in January 2026 was approximately 45%.

        Respond with ONLY a number between 0-100.
    actor_specific: false

  # AI usage in Swedish population
  - name: ai_population_adoption
    description: "Percentage of Swedish adults (11-80) using AI tools regularly"
    type: continuous
    range: [0, 100]
    unit: "percent"
    extraction:
      type: llm
      prompt: |
        Based on the world state, estimate the percentage of Swedish adults (ages 11-80)
        who use AI tools regularly, either at work or in private life.

        The baseline in January 2026 was approximately 48%.

        Respond with ONLY a number between 0-100.
    actor_specific: false

  # Public sentiment toward AI
  - name: public_sentiment
    description: "Swedish public opinion toward AI (-10 negative to +10 positive)"
    type: continuous
    range: [-10, 10]
    unit: "sentiment"
    extraction:
      type: llm
      prompt: |
        Based on the world state, rate the Swedish public's overall sentiment toward AI
        on a scale from -10 to +10:

        - -10 = Extremely negative, widespread fear and opposition
        - -5 = Mostly negative, significant concerns
        - 0 = Neutral, balanced views
        - +5 = Mostly positive, optimistic about benefits
        - +10 = Extremely positive, enthusiastic adoption

        Consider both the proportion of positive/negative views and the intensity
        of those views.

        Respond with ONLY a number between -10 and 10.
    actor_specific: false

  # Unemployment rate
  - name: unemployment_rate
    description: "Swedish unemployment rate (Arbetsförmedlingen definition)"
    type: continuous
    range: [0, 30]
    unit: "percent"
    extraction:
      type: llm
      prompt: |
        Based on the world state, estimate the Swedish unemployment rate as it would
        be reported by Arbetsförmedlingen.

        The baseline in January 2026 was approximately 7.5%.

        Consider both AI-related job displacement and general economic conditions.

        Respond with ONLY a number (percentage). Example: 7.5, 8.2, 6.8
    actor_specific: false

export_format: json
auto_export: true
