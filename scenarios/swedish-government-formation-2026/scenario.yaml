name: "Swedish Government Formation 2026"
description: "Which government constellations are reachable from the 13 September 2026 election result, how often each occurs, and what decides it"
start_date: "2026-09-13"
time_scale: "1 week per turn"
max_turns: 20

# The world begins with an election result supplied per run by sampler.py.
# Without a draw there is no result and the simulation is incoherent, so make
# that a hard error rather than a silently broken run.
requires_initial_state: true

actors:
  - social_democrats
  - moderates
  - sweden_democrats
  - centre_party
  - left_party
  - christian_democrats
  - green_party
  - liberals

research_questions:
  - id: rq_reachable_constellations
    question: "Which government constellations are reachable from the 2026 election result, and how often does each occur?"
    metrics: [viability_right_bloc, viability_left_bloc, viability_cross_bloc, snap_election_risk]
    events: [pm_vote_failed, pledge_broken, speaker_switches_mandate]
    notes: "The central question. Read the answer off which viability reaches 100, or whether snap_election_risk does instead."
  - id: rq_sd_in_cabinet
    question: "Under what conditions does SD move from support party into cabinet, rather than being kept outside again?"
    metrics: [sd_in_cabinet, viability_right_bloc]
    events: [pledge_broken, leader_resigns]
  - id: rq_threshold_leverage
    question: "How much does the Liberals' threshold outcome change which government forms?"
    metrics: [viability_right_bloc, viability_left_bloc]
    events: [pm_vote_failed]
    notes: "Answered by comparing the honest batch against the batch conditioned on L clearing 4 percent. Never pool the two."

# The run has a definite finish: a prime minister is elected, or four failed
# votes force an extraordinary election. Without these the loop would keep
# simulating a world whose answer is already settled.
termination:
  - id: government_formed
    when: "viability_right_bloc >= 100 or viability_left_bloc >= 100 or viability_cross_bloc >= 100"
    description: "A government has been formed and its prime minister elected"
  - id: snap_election_called
    when: "snap_election_risk >= 100"
    description: "Four prime-ministerial votes failed; an extraordinary election is called"

llm:
  model: "openrouter:qwen/qwen3-235b-a22b-2507"
  temperature: 0.7
  max_tokens: 2500
  max_tokens_by_task:
    rules: 3500
  probability_samples: 3

emergent_events:
  enabled: true
  max_per_turn: 1
  max_probability: 0.35

rule_evolution:
  # Disabled. Across four validation runs the model rewrote exactly one rule on
  # every unfrozen turn -- eight or nine turns running, always whichever rule sat
  # nearest the action. `max_changes_per_turn: 1` turned out to mean "exactly
  # one", not "at most one". With the invariants moved into constitution.md the
  # damage was contained, but the soft physics still differed between runs, and
  # that is noise in exactly what this scenario measures: the distribution over
  # outcomes. Swedish government formation has no emergent rules to discover --
  # the procedure is law and the commitments are on the record.
  freeze_until_turn: 21  # > max_turns, so rules never evolve
  max_changes_per_turn: 0

constitutional_enforcement:
  # Raised from 2 after the first validation batch: the constitution now carries
  # the viability and pressure invariants that metric rules kept renegotiating,
  # so there is more for the referee to catch and it needs room to correct
  # rather than persist a violation.
  max_attempts: 3
