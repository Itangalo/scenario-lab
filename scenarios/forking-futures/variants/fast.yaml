# FAST trajectory arm. Same physics file as every other arm -- these patches
# carry this run's regime figures directly, replacing the shared branched text,
# so each probability below is unambiguous instead of one column among three.
#
# Runs land in this scenario's runs/ alongside every other arm and the urgent
# variants; config.json identity separates populations.

base: "../scenario.yaml"

# NOTE: no `description` field here, on purpose. It is inherited from
# ../scenario.yaml, which is regime-neutral. The actor system prompt renders
# scenario_description verbatim ("The simulation focuses on ..."), so an
# arm-specific description states the regime in the regulator's own prompt and
# destroys the inference the scenario exists to study. Keep this variant's
# wording in the comment below, never in the field.
#
# This variant: Trajectory arm. AI progress compounds through the whole
# horizon: rapid, accelerating, with recursive self-improvement a live
# prospect in the second half. Identical physics and instruments to the
# other arms; only the world's speed differs.
name: "Forking Futures — Fast"

patches:
  - resource: events
    path: fast.events.patch.md
  - resource: metric_rules
    path: fast.rules.patch.md
