# Urgent disposition on the FAST arm. Inherits the arm's physics patches via
# base; only identity and the actor file differ. The actor file lives in the
# base scenario's background/actors/ because variant resources resolve there.

base: "fast.yaml"

# NOTE: no `description` field here, on purpose. It is inherited from
# ../scenario.yaml, which is regime-neutral. The actor system prompt renders
# scenario_description verbatim ("The simulation focuses on ..."), so an
# arm-specific description states the regime in the regulator's own prompt and
# destroys the inference the scenario exists to study. Keep this variant's
# wording in the comment below, never in the field.
#
# This variant: Urgent-regulator condition on the FAST arm: same world and
# physics as Forking Futures — Fast, but the regulator is told that
# preventing large-scale societal harm is what it exists for, and that it
# may break precedent to do so.
name: "Forking Futures — Fast (Urgent Regulator)"
actors:
  - regulator-urgent
