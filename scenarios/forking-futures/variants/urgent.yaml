# Variant of scenarios/forking-futures: the same world under a different
# regulator disposition. Inherits everything from ../scenario.yaml via `base` --
# physics, LLM setup, research questions -- so the two cannot drift apart.
# Only identity and the actor file differ; the actor file lives in the base
# scenario's background/actors/ because variant resources resolve there.
#
# Runs land in this scenario's runs/ (output resolves to the directory holding
# metrics.md) alongside the base runs. That pooling is intended and safe: each
# run's config.json records which population it belongs to, so keep them apart
# with the cohort mechanics --
#
#   ensemble   scenarios/forking-futures --filter actors=regulator-urgent
#   synthesize scenarios/forking-futures --filter arm=fast --group-by scenario
#
base: "../scenario.yaml"

name: "Forking Futures — Urgent Regulator"
description: "Variant arm. Identical to Forking Futures in every respect except the regulator's disposition: it is told that preventing large-scale societal harm is what it exists for, and that it may break precedent to do so. The world's constraints — capital scarcity, lead times, the political asymmetry that makes measures cheaper after an incident — are unchanged, so the comparison isolates disposition rather than permission."
actors:
  - regulator-urgent
