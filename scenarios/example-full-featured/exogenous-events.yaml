# Exogenous Events - Background events that shape the scenario
# This file demonstrates all four types of events: trends, random, conditional, and scheduled

exogenous_events:
  # ====================
  # TRENDS - Regular background developments
  # ====================

  - type: trend
    name: "AI Hype Cycle - Early Phase"
    description: |
      Media coverage and public interest in AI fluctuates. In early turns (1-3),
      media runs positive stories about AI successes in other cities.
      Public interest in AI initiatives increases (+5-10% support).
    turn_range: [1, 3]
    frequency: 1

  - type: trend
    name: "AI Hype Cycle - Middle Phase"
    description: |
      Media coverage shifts to AI failures and bias incidents elsewhere.
      Public skepticism increases, privacy advocates gain platform.
    turn_range: [4, 6]
    frequency: 1

  - type: trend
    name: "AI Hype Cycle - Late Phase"
    description: |
      Balanced coverage emerges, focus on governance frameworks.
      Emphasis shifts to oversight and safeguards rather than yes/no decisions.
    turn_range: [7, 10]
    frequency: 1

  - type: trend
    name: "Economic Pressures - Stable Budget"
    description: |
      Tax revenues meet projections, budget stable.
      Full $10M remains available for AI initiatives.
    turn_range: [1, 4]
    frequency: 2

  - type: trend
    name: "Economic Pressures - Revenue Shortfall"
    description: |
      Revenue shortfall requires budget review.
      Pressure to show ROI on spending, some budget may be redirected.
    turn_range: [5, 7]
    frequency: 1

  - type: trend
    name: "Economic Pressures - Election Year"
    description: |
      Election year budget politics intensify.
      Every expenditure scrutinized, both by supporters and opponents.
    turn_range: [8, 10]
    frequency: 1

  # ====================
  # RANDOM - Probabilistic events
  # ====================

  - type: random
    name: "AI Incident Elsewhere"
    description: |
      A facial recognition system in a nearby city falsely identifies dozens of people,
      leading to wrongful detentions. Story goes viral, intensifying scrutiny of
      AI deployments nationwide. Privacy advocates leverage this in Techville.
    probability: 0.15
    turn_range: [2, 8]
    once: true

  - type: random
    name: "Tech Company Scandal"
    description: |
      A competitor to TechSolutions Inc. is revealed to have sold customer data
      to third parties without adequate consent. Industry reputation takes a hit.
      Increased due diligence demands on all AI vendors.
    probability: 0.10
    turn_range: [3, 7]
    once: true

  - type: random
    name: "Federal Grant Opportunity"
    description: |
      Department of Transportation announces $50M in smart city grants, with
      preference for cities demonstrating responsible AI deployment.
      Could significantly expand available funding if Techville qualifies.
    probability: 0.20
    turn_range: [2, 6]
    once: true

  - type: random
    name: "Grassroots Momentum"
    description: |
      Local high school students organize "Tech Futures Forum" that goes viral
      on social media, bringing youth voice into debate. Could swing either
      pro-innovation or pro-privacy depending on how city engages.
    probability: 0.15
    turn_range: [3, 8]
    once: true

  # ====================
  # CONDITIONAL - Triggered by scenario state
  # ====================

  - type: conditional
    name: "Surveillance Backlash"
    description: |
      Strong opposition emerges when surveillance systems are proposed.
      Digital Rights Coalition launches petition that gathers 10,000 signatures
      in one week. Local ACLU chapter threatens lawsuit. Media coverage intensifies.
      Mayor's office flooded with calls. City Council members face pressure.
    conditions:
      surveillance_proposal_level: ">= 5"
    turn_range: [1, 10]
    once: true

  - type: conditional
    name: "Success Breeds Support"
    description: |
      Successful pilot program builds momentum for expansion.
      Success stories spread through community networks. Local media runs feature
      on "Techville's Smart Future." Other departments request similar programs.
      Budget committee signals willingness to expand funding.
    conditions:
      pilot_success_level: ">= 7"
    turn_range: [2, 10]
    once: true

  - type: conditional
    name: "Implementation Problems"
    description: |
      Technical issues damage credibility.
      System glitches become public. Social media posts show failures. Tech company
      scrambles to respond. Opposition groups use as evidence of rushing deployment.
      Calls for independent audit grow.
    conditions:
      system_reliability: "< 4"
    turn_range: [2, 10]
    once: true

  - type: conditional
    name: "Vendor Lock-in Concerns"
    description: |
      Large contract raises procurement questions.
      City Controller raises questions about single-vendor dependence and
      lack of competitive bidding. Procurement process comes under scrutiny.
      City Council requests independent cost-benefit analysis.
    conditions:
      budget_spent: "> 5"
    turn_range: [3, 10]
    once: true

  # ====================
  # SCHEDULED - Events at specific times
  # ====================

  - type: scheduled
    turn: 3
    name: "Quarterly Budget Review Q1"
    description: |
      City Council holds quarterly budget review. All departments must justify
      spending and show progress. AI initiatives come under standard scrutiny.
      Any spending must be defended with results.
    once: true

  - type: scheduled
    turn: 5
    name: "Annual Community Forum"
    description: |
      City charter requires annual community forum on major initiatives.
      All actors must present progress and answer questions. Media coverage
      guaranteed. Formal public comment period opens. Can't avoid public engagement.
    once: true

  - type: scheduled
    turn: 6
    name: "Quarterly Budget Review Q2"
    description: |
      City Council holds quarterly budget review. All departments must justify
      spending and show progress. AI initiatives come under standard scrutiny.
    once: true

  - type: scheduled
    turn: 7
    name: "Election Season Begins"
    description: |
      Election season officially begins. Mayor's challengers announce campaigns.
      All major decisions become campaign issues. Opposition research begins.
      Every vote on City Council is calculated for political impact.
    once: true

  - type: scheduled
    turn: 8
    name: "Fiscal Year End Approaches"
    description: |
      Fiscal year ends in 2 months. Unspent allocated funds may be reclaimed
      by City Council for other priorities. Pressure to commit funds or
      risk losing them. Accelerated decision-making likely.
    once: true

  - type: scheduled
    turn: 9
    name: "Quarterly Budget Review Q3"
    description: |
      City Council holds quarterly budget review. Final review before election.
      Maximum political scrutiny on all spending decisions.
    once: true
