# Example scenario configuration with fine-grained LLM selection
# This demonstrates using different models for different tasks

name: "Sweden and AI 2030"
description: "Exploratory simulation of AI development's impact on Swedish society between 2026 and 2030"
start_date: "2026-01"
time_scale: "6 months per turn"
max_turns: 4

actors:
  - government
  - labor-unions
  - media
  - business-sector

llm:
  # Fast/cheap model for event evaluation
  events: "x-ai/grok-4.1-fast"

  # Per-actor model selection
  actors:
    government: "x-ai/grok-4.1-fast"
    labor-unions: "x-ai/grok-4.1-fast"
    media: "x-ai/grok-4.1-fast"
    business-sector: "x-ai/grok-4.1-fast"

  # Rules can use cheaper model
  rules: "x-ai/grok-4.1-fast"

  # Metrics and narrative benefits from better model
  metrics: "google/gemini-3-flash-preview"

  # Global settings
  temperature: 0.7
  max_tokens: 2000
