# Example scenario configuration with fine-grained LLM selection
# This demonstrates using different models for different tasks

name: "Sweden and AI 2030"
description: "Exploratory simulation of AI development's impact on Swedish society between 2026 and 2030"
start_date: "2026-01"
time_scale: "6 months per turn"
max_turns: 4

actors:
  - government
  - labor-unions
  - media
  - business-sector

llm:
  # Fast/cheap model for event evaluation
  events: "openrouter:qwen/qwen3-235b-a22b-2507"

  # Per-actor model selection
  actors:
    government: "openrouter:qwen/qwen3-235b-a22b-2507"
    labor-unions: "openrouter:qwen/qwen3-235b-a22b-2507"
    media: "openrouter:qwen/qwen3-235b-a22b-2507"
    business-sector: "openrouter:qwen/qwen3-235b-a22b-2507"

  # Rules can use cheaper model
  rules: "openrouter:qwen/qwen3-235b-a22b-2507"

  # Metrics and narrative benefits from better model
  metrics: "openrouter:google/gemini-3-flash-preview"

  # Global settings
  temperature: 0.7
  max_tokens: 2000
