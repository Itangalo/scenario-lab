name: "Sweden and AI 2030"
description: "Explore how Sweden handles AI development from 2026 to 2030"
start_date: "2026-01"
time_scale: "6 months per turn"
max_turns: 10

actors:
  - government
  - labor-unions
  - media
  - business-sector

research_questions:
  - id: rq_labor_peace
    question: "Does the Swedish tripartite model absorb AI-driven labor displacement without open conflict, and under what conditions does it fail?"
    metrics: [unemployment, public_sentiment_to_ai]
    events: [strike]
    notes: "The central question: whether institutional absorption holds under pressure."
  - id: rq_shock_response
    question: "How much does an external shock change Sweden's trajectory, compared with runs where it does not occur?"
    metrics: [ai_capability, ai_adoption_sweden]
    events: [ai_bubble_collapse, ai_incident_sweden, ai_stall]
  - id: rq_adoption_ceiling
    question: "What limits AI adoption in Sweden by 2030 – capability, sentiment, or institutional friction?"
    metrics: [ai_adoption_sweden, ai_capability, public_sentiment_to_ai]

llm:
  model: "openrouter:qwen/qwen3-235b-a22b-2507"
  temperature: 0.7
  max_tokens: 2000
  max_tokens_by_task:
    rules: 3500
