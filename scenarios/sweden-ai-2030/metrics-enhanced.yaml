        max: 100
        unit: "credibility_index"
        description: "Public trust in media reporting"
        change_magnitudes:
          small: [0.02, 0.05]
          medium: [0.05, 0.12]
          large: [0.12, 0.25]
        randomness: 0.12
        dependencies:
          # Independence boosts credibility
          - metric: "actors.media.private.editorial_independence"
