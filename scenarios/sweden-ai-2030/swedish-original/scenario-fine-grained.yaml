# Example scenario configuration with fine-grained LLM selection
# This demonstrates using different models for different tasks

name: "Sverige och AI 2030"
description: "Explorativ simulering av AI-utvecklingens påverkan på det svenska samhället mellan 2026 och 2030"
start_date: "2026-01"
time_scale: "6 months per turn"
max_turns: 4

actors:
  - government
  - labor-unions
  - media
  - business-sector

llm:
  # Fast/cheap model for event evaluation
  events: "x-ai/grok-2-1212"

  # Per-actor model selection
  actors:
    government: "anthropic/claude-3.5-haiku-20241022"
    labor-unions: "anthropic/claude-3.5-haiku-20241022"
    media: "anthropic/claude-3.5-haiku-20241022"
    business-sector: "anthropic/claude-3.5-haiku-20241022"

  # Rules can use cheaper model
  rules: "anthropic/claude-3.5-haiku-20241022"

  # Metrics and narrative benefits from better model
  metrics: "anthropic/claude-sonnet-4"

  # Global settings
  temperature: 0.7
  max_tokens: 2000
